<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — EduTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dash">

<div class="page-loader"><div class="loader-ring"></div><p>Loading reports…</p></div>
<div class="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:290;display:none;"></div>

<div class="app-shell">
  <aside class="sidebar glass">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke="url(#g1)" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="18" stroke-linecap="round" fill="none"/><defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#4cc9f0"/><stop offset="1" stop-color="#7209b7"/></linearGradient></defs></svg>
      EduTrack
    </div>
    <span class="side-label">Overview</span>
    <a href="admin-dashboard.html" class="side-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <span class="side-label">Insights</span>
    <a href="reports.html" class="side-link active"><i class="fa-solid fa-file-lines"></i> Reports</a>
    <span class="side-label">Account</span>
    <a href="profile.html" class="side-link"><i class="fa-solid fa-user"></i> Profile</a>
    <a href="settings.html" class="side-link"><i class="fa-solid fa-gear"></i> Settings</a>
    <div class="sidebar-footer">
      <button class="side-link logout-btn" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex items-center gap-1">
        <button class="mobile-menu-btn icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-search"><i class="fa-solid fa-search"></i><input type="text" placeholder="Quick search…"></div>
      </div>
      <div class="topbar-actions">
        <label class="icon-btn" title="Toggle theme"><input type="checkbox" class="theme-toggle" style="display:none;"><i class="fa-solid fa-moon"></i></label>
        <div class="user-chip"><img src="https://i.pravatar.cc/100?img=68" alt=""><span class="current-user-name">Admin</span></div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">Attendance Reports</h1>
      <p class="page-sub">Filter by department and date range, then export for audits or meetings.</p>

      <div class="glass card reveal">
        <div class="filter-bar">
          <div class="filter-field">
            <label>Department</label>
            <select id="reportDeptFilter"></select>
          </div>
          <div class="filter-field">
            <label>Range</label>
            <select id="reportRangeFilter">
              <option value="1">Today</option>
              <option value="7" selected>Last 7 days</option>
              <option value="30">Last 30 days (Monthly)</option>
              <option value="90">Last 90 days</option>
            </select>
          </div>
          <div class="filter-field" style="flex:1;">
            <label>Search student</label>
            <input type="text" id="reportSearch" placeholder="Search by name or roll no.">
          </div>
          <div class="filter-field">
            <label>&nbsp;</label>
            <div class="flex gap-1">
              <button class="btn btn-ghost btn-sm" id="exportExcelBtn"><i class="fa-solid fa-file-excel"></i> Excel</button>
              <button class="btn btn-primary btn-sm" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            </div>
          </div>
        </div>

        <div class="card-head">
          <h3><i class="fa-solid fa-table-list"></i> Records</h3>
          <span id="reportCount" style="color:var(--c-muted); font-size:.85rem;">0 records</span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Student</th><th>Roll No.</th><th>Department</th><th>Subject</th><th>Status</th></tr></thead>
            <tbody id="reportsTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/dashboard-common.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
