<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — EduTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash">

<div class="page-loader"><div class="loader-ring"></div><p>Loading profile…</p></div>
<div class="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:290;display:none;"></div>

<div class="app-shell">
  <aside class="sidebar glass">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke="url(#g1)" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="18" stroke-linecap="round" fill="none"/><defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#4cc9f0"/><stop offset="1" stop-color="#7209b7"/></linearGradient></defs></svg>
      EduTrack
    </div>
    <span class="side-label">Overview</span>
    <a href="admin-dashboard.html" class="side-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="reports.html" class="side-link"><i class="fa-solid fa-file-lines"></i> Reports</a>
    <span class="side-label">Account</span>
    <a href="profile.html" class="side-link active"><i class="fa-solid fa-user"></i> Profile</a>
    <a href="settings.html" class="side-link"><i class="fa-solid fa-gear"></i> Settings</a>
    <div class="sidebar-footer">
      <button class="side-link logout-btn" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex items-center gap-1">
        <button class="mobile-menu-btn icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
      <div class="topbar-actions">
        <label class="icon-btn" title="Toggle theme"><input type="checkbox" class="theme-toggle" style="display:none;"><i class="fa-solid fa-moon"></i></label>
        <div class="user-chip"><img src="https://i.pravatar.cc/100?img=68" alt=""><span class="current-user-name">Account</span></div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">Your Profile</h1>
      <p class="page-sub">Update your personal details, photo and password.</p>

      <div class="glass card reveal">
        <div class="profile-header">
          <div class="avatar-upload">
            <img id="profilePhotoPreview" src="https://i.pravatar.cc/150?img=68" alt="Profile photo">
            <label class="upload-btn" title="Change photo">
              <i class="fa-solid fa-camera"></i>
              <input type="file" id="photoUploadInput" accept="image/*" style="display:none;">
            </label>
          </div>
          <div>
            <h3 class="current-user-name">Account Holder</h3>
            <p style="color:var(--c-muted);"><span class="current-user-role">Role</span> · EduTrack member</p>
          </div>
        </div>
      </div>

      <div class="grid-2 mt-2">
        <div class="glass card reveal">
          <div class="card-head"><h3><i class="fa-solid fa-id-card"></i> Personal Information</h3></div>
          <form id="profileForm">
            <div class="form-group"><label>Full name</label><input class="form-control" type="text" value="Alex Morgan"></div>
            <div class="form-group"><label>Email</label><input class="form-control" type="email" value="alex.morgan@college.edu"></div>
            <div class="form-group"><label>Phone</label><input class="form-control" type="tel" value="+1 555 010 2024"></div>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-check"></i> Save Changes</button>
            <p class="form-msg" id="profileMsg"></p>
          </form>
        </div>

        <div class="glass card reveal">
          <div class="card-head"><h3><i class="fa-solid fa-lock"></i> Change Password</h3></div>
          <form id="passwordForm">
            <div class="form-group input-icon-group">
              <label>Current password</label>
              <i class="fa-solid fa-lock field-icon"></i>
              <input class="form-control" type="password" id="currentPassword" placeholder="••••••••" required>
              <i class="fa-solid fa-eye toggle-pass"></i>
            </div>
            <div class="form-group input-icon-group">
              <label>New password</label>
              <i class="fa-solid fa-lock field-icon"></i>
              <input class="form-control" type="password" id="newPassword" placeholder="At least 6 characters" required>
              <i class="fa-solid fa-eye toggle-pass"></i>
            </div>
            <div class="form-group input-icon-group">
              <label>Confirm new password</label>
              <i class="fa-solid fa-lock field-icon"></i>
              <input class="form-control" type="password" id="confirmPassword" placeholder="Repeat new password" required>
              <i class="fa-solid fa-eye toggle-pass"></i>
            </div>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-key"></i> Update Password</button>
            <p class="form-msg" id="passwordMsg"></p>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/dashboard-common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
