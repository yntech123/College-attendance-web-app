<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — EduTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash">

<div class="page-loader"><div class="loader-ring"></div><p>Loading dashboard…</p></div>
<div class="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:290;display:none;"></div>

<div class="app-shell">
  <aside class="sidebar glass">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke="url(#g1)" stroke-width="4" stroke-dasharray="80" stroke-dashoffset="18" stroke-linecap="round" fill="none"/><defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#4cc9f0"/><stop offset="1" stop-color="#7209b7"/></linearGradient></defs></svg>
      EduTrack
    </div>
    <span class="side-label">Overview</span>
    <a href="teacher-dashboard.html" class="side-link active"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <span class="side-label">Attendance</span>
    <a href="#rollCallSection" class="side-link"><i class="fa-solid fa-clipboard-check"></i> Take Attendance</a>
    <a href="#historySection" class="side-link"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
    <a href="reports.html" class="side-link"><i class="fa-solid fa-file-lines"></i> Reports</a>
    <span class="side-label">Account</span>
    <a href="profile.html" class="side-link"><i class="fa-solid fa-user"></i> Profile</a>
    <a href="settings.html" class="side-link"><i class="fa-solid fa-gear"></i> Settings</a>
    <div class="sidebar-footer">
      <button class="side-link logout-btn" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex items-center gap-1">
        <button class="mobile-menu-btn icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-search"><i class="fa-solid fa-search"></i><input type="text" placeholder="Search students…"></div>
      </div>
      <div class="topbar-actions">
        <label class="icon-btn" title="Toggle theme"><input type="checkbox" class="theme-toggle" style="display:none;"><i class="fa-solid fa-moon"></i></label>
        <button class="icon-btn notif-btn" style="position:relative;">
          <i class="fa-solid fa-bell"></i><span class="dot"></span>
          <div class="dropdown-panel notif-panel glass">
            <div class="notif-item"><i class="fa-solid fa-clock"></i><div><strong>Class starting soon</strong><small>Data Structures — 2nd Year A, 10:00 AM</small></div></div>
            <div class="notif-item"><i class="fa-solid fa-circle-check"></i><div><strong>Attendance saved</strong><small>Yesterday's roll call synced</small></div></div>
          </div>
        </button>
        <div class="user-chip"><img src="https://i.pravatar.cc/100?img=48" alt=""><span class="current-user-name">Teacher</span></div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">Good to see you, <span class="current-user-name">Teacher</span></h1>
      <p class="page-sub">Select a class below to take or review attendance.</p>

      <div class="glass card reveal" id="rollCallSection">
        <div class="card-head"><h3><i class="fa-solid fa-sliders"></i> Select Class</h3></div>
        <div class="filter-bar">
          <div class="filter-field">
            <label>Department</label>
            <select id="filterDept">
              <option value="CSE">Computer Science</option>
              <option value="ECE">Electronics &amp; Comm.</option>
              <option value="MECH">Mechanical Engg.</option>
            </select>
          </div>
          <div class="filter-field">
            <label>Year</label>
            <select id="filterYear">
              <option>1st Year</option>
              <option selected>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
          <div class="filter-field">
            <label>Section</label>
            <select id="filterSection">
              <option>A</option><option>B</option><option>C</option>
            </select>
          </div>
          <div class="filter-field">
            <label>Subject</label>
            <select id="filterSubject"></select>
          </div>
        </div>

        <div class="roll-list" id="rollList"></div>

        <div class="flex items-center justify-between mt-2" style="flex-wrap:wrap; gap:1rem;">
          <p class="form-msg" id="saveAttendanceMsg" style="margin:0;"></p>
          <button class="btn btn-primary" id="saveAttendanceBtn"><i class="fa-solid fa-floppy-disk"></i> Save Attendance</button>
        </div>
      </div>

      <div class="glass card mt-2 reveal" id="historySection">
        <div class="card-head"><h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Attendance History</h3></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Student</th><th>Subject</th><th>Status</th></tr></thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/dashboard-common.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
